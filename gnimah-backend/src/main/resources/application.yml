server:
  # Render (et la plupart des PaaS) injectent PORT et exigent que l'appli écoute dessus.
  port: ${PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: gnimah-backend
  # Fichier local, non versionné (.gitignore) : surcharge JWT_SECRET etc. pour un lancement direct
  # depuis l'IDE sans passer par docker-compose. "optional:" = aucune erreur si le fichier est absent
  # (cas normal en prod/CI/Docker, où JWT_SECRET vient d'une vraie variable d'environnement).
  config:
    import: optional:classpath:application-local.yml

  datasource:
    url: jdbc:postgresql://localhost:5432/gnimah_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none          # Flyway gère le schéma
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:noreply@gnimah.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      # Le défaut de Spring est 1 Mo : une photo d'hôtel le dépasse largement et
      # serait rejetée avant même d'atteindre la validation métier (10 Mo).
      max-file-size: 12MB
      max-request-size: 14MB

  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: Africa/Abidjan
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

app:
  jwt:
    # Aucune valeur par défaut : un secret codé en dur dans un fichier versionné serait visible
    # de quiconque a accès au dépôt et permettrait de forger des tokens valides (y compris ADMIN).
    # JWT_SECRET doit être défini explicitement (variable d'environnement) dans tous les environnements,
    # y compris en local — voir docker-compose.yml ou la documentation de déploiement.
    secret: ${JWT_SECRET}
    expiration: 86400000
    refresh-expiration: 604800000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}
  keepalive:
    # Vide par défaut (désactivé en local/test). À définir en prod (Render) avec
    # la propre URL publique du service pour empêcher la mise en veille du plan gratuit.
    target-url: ${KEEPALIVE_TARGET_URL:}
  demo-data:
    # Faux clients, séjours et paiements de démonstration (DemoDataSeeder).
    # Jamais en production : ils occuperaient des chambres et fausseraient la caisse.
    enabled: ${DEMO_DATA_ENABLED:false}
  pdf:
    output-dir: ${PDF_OUTPUT_DIR:./pdfs}
  cloudinary:
    # Hébergement des visuels de la galerie. Facultatif : sans ces valeurs,
    # l'administration reste utilisable pour référencer des images déjà en ligne,
    # mais l'envoi de fichier depuis l'application est désactivé.
    # Le secret donne un accès complet au compte : il ne doit exister que comme
    # variable d'environnement du serveur, jamais dans le dépôt ni dans le frontend.
    # Le nom du compte et le préréglage ne sont pas des secrets : le premier
    # figure dans chaque URL d'image, le second est prévu par Cloudinary pour
    # être public (c'est le principe d'un préréglage « non signé »). Ils ont donc
    # une valeur par défaut, pour que l'envoi de photos fonctionne sans aucune
    # configuration de serveur.
    cloud-name: ${CLOUDINARY_CLOUD_NAME:dehzeeo6p}
    upload-preset: ${CLOUDINARY_UPLOAD_PRESET:gnimah_media}
    # La clé et le secret, eux, n'ont aucune valeur par défaut. Renseignés, le
    # serveur signe lui-même les envois — voie préférée, car le préréglage non
    # signé peut être utilisé par quiconque lit le code du frontend.
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    folder: ${CLOUDINARY_FOLDER:gnimah/galerie}
  hotel:
    name: "Résidence Hôtel GNIMAH"
    address: "Abobo, Boulevard Belleville, Carrefour Mosquée, Rue Cocotier, Lot 227, Îlot 110, Abidjan"
    phone: ""
    email: ""

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      enabled: false   # SMTP non configuré en dev

logging:
  level:
    # INFO en production ; LOG_LEVEL_APP=DEBUG pour un diagnostic ponctuel.
    com.gnimah: ${LOG_LEVEL_APP:INFO}
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
    org.flywaydb: INFO
